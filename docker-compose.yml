services:
  monitor:
    build: .
    image: service-sentinel:latest
    container_name: service-sentinel
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CONFIG_PATH: /app/config.yaml
      DB_PATH: /app/data/monitor.db
      HEARTBEAT_PATH: /app/data/heartbeat.json
      LOG_FORMAT: json
      TZ: Europe/Moscow
    volumes:
      # config.yaml is optional: without it the monitor runs on the sites added from
      # the Telegram bot (they live in the monitor-data volume). Create the file before
      # `docker compose up`, otherwise Docker creates an empty directory in its place.
      - ./config.yaml:/app/config.yaml:ro
      - monitor-data:/app/data
    # Hardening: the app needs only outbound HTTPS and its data volume.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-m", "monitor.healthcheck"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  monitor-data:
